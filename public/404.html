<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Rana Abdul Rehman</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, rgba(37,99,235,0.25), transparent 50%), #0b1120;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: #e2e8f0;
        text-align: center;
        padding: 24px;
      }
      .code {
        font-size: clamp(64px, 14vw, 120px);
        font-weight: 800;
        background: linear-gradient(90deg, #60a5fa, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin: 0;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 12px 0 6px; color: #fff; }
      p { color: #94a3b8; margin: 0 0 28px; font-size: 15px; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 10px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a:hover { background: #3b82f6; transform: scale(1.03); }
    </style>
  </head>
  <body>
    <div>
      <p class="code">404</p>
      <h1>This page doesn't exist</h1>
      <p>The link you followed may be broken, or the page may have been moved.</p>
      <a href="/">← Back to Rana's Portfolio</a>
    </div>
  </body>
</html>
